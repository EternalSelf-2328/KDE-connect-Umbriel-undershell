name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: all
        options: [all, debian-13, ubuntu-26.04, fedora-44, arch, void, nixos]
        description: Build all targets or one target without publishing
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      native: ${{ steps.targets.outputs.native }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - id: targets
        name: Select build targets
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          targets=json.loads(Path('packaging/targets.json').read_text());choice=os.environ['TARGET']
          assert choice in ['all','nixos']+[t['target'] for t in targets]
          selected=[t for t in targets if choice=='all' or t['target']==choice]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('matrix='+json.dumps({'include':selected})+'\n')
            output.write('native='+str(bool(selected)).lower()+'\n')
          PY
      - name: Validate version and signed APK checksum
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,re
          version=re.search(r'project\(UmbrielConnect VERSION ([^ ]+)',Path('CMakeLists.txt').read_text())[1]
          if os.environ['REF'].startswith('refs/tags/'):assert os.environ['TAG']=='v'+version
          for line in Path('downloads/SHA256SUMS').read_text().splitlines():
            digest,name=line.split();assert hashlib.sha256((Path('downloads')/name).read_bytes()).hexdigest()==digest,name
          PY
  build:
    if: needs.version.outputs.native == 'true'
    needs: version
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - name: Bootstrap Git
        run: ${{ matrix.bootstrap }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {submodules: recursive, persist-credentials: false}
      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo 'CCACHE_MAXSIZE=700M' >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: compiler-cache
        with:
          path: .ccache
          key: native-v1-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: native-v1-${{ matrix.target }}-
      - name: Build and test native package
        env: {UMBRIEL_PACKAGE_CONTAINER: '1', UMBRIEL_BUILD_JOBS: '3'}
        run: bash packaging/build-release.sh '${{ matrix.target }}' "$GITHUB_WORKSPACE/out"
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: native-v1-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: [version, build]
    name: Install ${{ matrix.target }} on a clean image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - run: ${{ matrix.runtimeBootstrap }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: 'package-${{ matrix.target }}', path: packages}
      - run: ${{ matrix.install }}
      - name: Render installed applications in isolation
        run: bash packaging/smoke.sh /usr "$GITHUB_WORKSPACE/previews"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'previews-${{ matrix.target }}', path: previews/*.png, retention-days: 7}
  nix:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'nixos'
    needs: version
    name: Build NixOS 26.05 package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - name: Lock and build
        run: |
          if test ! -f flake.lock; then
            test '${{ github.event_name }}' = workflow_dispatch
            nix flake lock
          fi
          nix build --no-write-lock-file --print-build-logs .#default
          mkdir -p out
          nix eval --impure --json --expr '
            let
              f = builtins.getFlake (toString ./.);
              configuration = autoStart: (f.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [ f.nixosModules.default {
                  system.stateVersion = "26.05";
                  services.umbriel-connect = { enable = true; inherit autoStart; };
                } ];
              }).config;
              manual = configuration false;
              automatic = configuration true;
            in
            assert manual.systemd.user.services.umbriel-connect-engine.wantedBy == [];
            assert manual.systemd.user.services.umbriel-connect-remote.wantedBy == [];
            assert automatic.systemd.user.services.umbriel-connect-engine.wantedBy == [ "graphical-session.target" ];
            assert automatic.systemd.user.services.umbriel-connect-remote.wantedBy == [ "graphical-session.target" ];
            {
              manualWantedBy = manual.systemd.user.services.umbriel-connect-engine.wantedBy;
              automaticWantedBy = automatic.systemd.user.services.umbriel-connect-engine.wantedBy;
              engineBusName = manual.systemd.user.services.umbriel-connect-engine.serviceConfig.BusName;
            }
          ' > out/nixos-module-check.json
          cp flake.lock out/flake.lock
          nix path-info --closure-size --json ./result > out/nix-closure.json
          nix-store --export $(nix-store --query --requisites ./result) | xz -T2 -3 > out/umbriel-connect-0.8.0-nixos-26.05-x86_64.nar.xz
          readlink -f result > out/nix-store-path.txt
      - name: Render installed Nix applications in isolation
        run: bash packaging/smoke.sh "$(readlink -f result)" "$GITHUB_WORKSPACE/previews"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'previews-nixos', path: 'previews/*.png', retention-days: 7}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'package-nixos', path: 'out/*', if-no-files-found: error, retention-days: 7}
  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {submodules: recursive, persist-credentials: false, fetch-depth: 0}
      - name: Complete corresponding sources and signed Android app
        run: |
          mkdir -p out
          bash packaging/source.sh "$PWD/out"
          cp downloads/UmbrielConnect-0.8.0.apk out/
          cp downloads/SIGNING-CERTIFICATE-SHA256 out/ANDROID-SIGNING-CERTIFICATE-SHA256
          source_hash=$(sha256sum out/*-source.tar.xz | cut -d' ' -f1)
          sed "s/RELEASE_SOURCE_SHA256/$source_hash/" packaging/void/template > out/umbriel-connect-0.8.0-void-template
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'source-and-android', path: 'out/*', if-no-files-found: error, retention-days: 7}
  release:
    needs: [verify, nix, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'package-*', merge-multiple: true, path: release}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'source-and-android', path: release}
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cd ..
          gh release create "$TAG" --verify-tag --prerelease --title "Umbriel Connect $TAG · experimental" --notes-file packaging/release-notes.md release/*
